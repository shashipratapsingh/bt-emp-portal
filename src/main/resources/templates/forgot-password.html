<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <link rel="stylesheet" th:href="@{/css/forgot-password.css}">

</head>
<body>

<div class="container">
    <h2>Forgot Password?</h2>
    <p>Apni registered Email ID dalein, hum aapko ek 6-digit OTP bhejenge.</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/auth/forgot-password}" method="post">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="example@company.com" required />
        </div>
        <button type="submit">Get OTP</button>
    </form>

    <a class="back-link" th:href="@{/auth/loginPage}">← Back to Login</a>
</div>

</body>
</html>
