<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/reset-password.css}">
</head>
<body>

<div class="container">
    <h2>Reset Password</h2>

    <div class="info">OTP aapki email par bhej diya gaya hai.</div>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/auth/reset-password}" method="post">

        <input type="hidden" name="email" th:value="${email}" />

        <div class="form-group">
            <label for="otp">Enter 6-Digit OTP</label>
            <input type="text" id="otp" name="otp" placeholder="123456" maxlength="6" required />
        </div>

        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Minimum 6 characters" required />
        </div>

        <button type="submit">Update Password</button>
    </form>
</div>

</body>
</html>
