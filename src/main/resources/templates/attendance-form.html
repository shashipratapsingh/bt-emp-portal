<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Attendance Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/attendance-form.css}">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card-box">

                <div class="text-center mb-4">
                    <i class="fa-solid fa-calendar-check fa-2x"></i>
                    <h3 class="mt-2">Mark Attendance</h3>
                </div>

                <form th:action="@{/attendance/save}" th:object="${attendance}" method="post">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label>Employee</label>
                        <select name="employeeId" class="form-select">
                            <option value="">Select Employee</option>
                            <option th:each="emp : ${employees}"
                                    th:value="${emp.id}"
                                    th:text="${emp.name}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label>Date</label>
                        <input type="date" th:field="*{date}" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label>Status</label>
                        <select th:field="*{status}" class="form-select">
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Leave">Leave</option>
                        </select>
                    </div>

                    <button class="btn btn-success w-100">
                        Save Attendance
                    </button>

                    <a th:href="@{/attendance}" class="btn btn-light w-100 mt-2">
                        Back
                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
