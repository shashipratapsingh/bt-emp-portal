<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>View Timesheet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/timesheet-view.css}">


</head>

<body>

<div class="container mt-5">

    <aside th:replace="~{fragments/sidebar :: sidebar-component}"></aside>

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow timesheet-card">


                <!-- Header -->
                <div class="card-header-custom text-white">

                    <h4 class="mb-0">
                        <i class="fa-solid fa-clock me-2"></i>
                        Timesheet Details
                    </h4>

                </div>

                <!-- Body -->
                <div class="card-body p-4">

                    <div class="row g-4">

                        <!-- Date -->
                        <div class="col-md-6">

                            <div class="detail-box">

                                <div class="label-title">
                                    <i class="fa-solid fa-calendar-days me-2"></i>
                                    Date
                                </div>

                                <div class="value-text mt-2"
                                     th:text="${timesheet.date}">
                                </div>

                            </div>

                        </div>

                        <!-- Hours -->
                        <div class="col-md-6">

                            <div class="detail-box">

                                <div class="label-title">
                                    <i class="fa-solid fa-hourglass-half me-2"></i>
                                    Hours Worked
                                </div>

                                <div class="value-text mt-2"
                                     th:text="${timesheet.hoursWorked + ' Hours'}">
                                </div>

                            </div>

                        </div>

                        <!-- Status -->
                        <div class="col-md-6">

                            <div class="detail-box">

                                <div class="label-title">
                                    <i class="fa-solid fa-circle-check me-2"></i>
                                    Status
                                </div>

                                <div class="mt-2">

                                    <span class="badge bg-warning text-dark"
                                          th:if="${timesheet.status == 'PENDING'}">
                                        PENDING
                                    </span>

                                    <span class="badge bg-success"
                                          th:if="${timesheet.status == 'APPROVED'}">
                                        APPROVED
                                    </span>

                                    <span class="badge bg-danger"
                                          th:if="${timesheet.status == 'REJECTED'}">
                                        REJECTED
                                    </span>

                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- Description -->
                    <div class="mt-4">

                        <div class="label-title mb-2">

                            <i class="fa-solid fa-align-left me-2"></i>
                            Task Description

                        </div>

                        <div class="detail-box description-box">

                            <span th:text="${timesheet.taskDescription}">
                            </span>

                        </div>

                    </div>

                    <!-- Edit Button -->
                    <div class="text-end mt-4">

                        <a th:href="@{/employee/timesheet/edit/{id}(id=${timesheet.id})}"
                           class="btn btn-primary btn-custom">

                            <i class="fa-solid fa-pen-to-square me-2"></i>
                            Edit Timesheet

                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
