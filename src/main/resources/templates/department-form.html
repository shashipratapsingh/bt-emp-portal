<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Department Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/department-form.css}">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card-box">

                <!-- HEADER -->
                <div class="header">
                    <div class="icon">
                        <i class="fa-solid fa-building"></i>
                    </div>
                    <h3>Add / Update Department</h3>
                    <p>Manage organization departments</p>
                </div>

                <!-- FORM -->
                <form th:action="@{/departments/save}"
                      th:object="${department}"
                      method="post">

                    <input type="hidden" th:field="*{id}">

                    <!-- Department Name -->
                    <div class="mb-3">
                        <label>Department Name</label>
                        <input type="text"
                               th:field="*{departmentName}"
                               class="form-control"
                               placeholder="Enter department name"
                               required>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label>Description</label>
                        <textarea th:field="*{description}"
                                  class="form-control"
                                  rows="3"
                                  placeholder="Enter description"></textarea>
                    </div>

                    <!-- BUTTONS -->
                    <div class="d-flex justify-content-between mt-4">

                        <button type="submit" class="btn btn-success">
                            <i class="fa fa-save"></i> Save
                        </button>

                        <a th:href="@{/departments}" class="btn btn-secondary">
                            <i class="fa fa-arrow-left"></i> Back
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
