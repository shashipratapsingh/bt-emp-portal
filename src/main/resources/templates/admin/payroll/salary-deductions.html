<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salary Deductions</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .main-content { margin-left: 280px; min-height: 100vh; background: #f5f7fa; }
        .content-wrapper { padding: 25px 30px; }
        .page-header h4 { font-weight: 700; color: #1a1a2e; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .card-header { border-radius: 15px 15px 0 0 !important; padding: 18px 25px; background: linear-gradient(135deg, #1a1a2e, #16213e); border: none; }
        .card-header h4 { margin: 0; color: #fff; font-weight: 600; }
        .card-body { padding: 25px; }
        .deduction-card { background: #f8f9fa; padding: 15px; border-radius: 10px; border-left: 4px solid #dc3545; margin-bottom: 15px; }
        .btn-add { background: linear-gradient(135deg, #dc3545, #bd2130); border: none; padding: 10px 25px; border-radius: 10px; color: #fff; font-weight: 600; }
        .btn-add:hover { background: linear-gradient(135deg, #bd2130, #a71d2a); color: #fff; }
        @media (max-width: 768px) { .main-content { margin-left: 0; } .content-wrapper { padding: 15px; } }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar-admin :: sidebar-component}"></div>

<div class="main-content">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="content-wrapper">
        <div class="page-header d-flex justify-content-between align-items-center">
            <div>
                <h4><i class="fa-solid fa-circle-minus me-2 text-danger"></i> Salary Deductions</h4>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
                        <li class="breadcrumb-item"><a href="#">Payroll</a></li>
                        <li class="breadcrumb-item active">Deductions</li>
                    </ol>
                </nav>
            </div>
            <button class="btn-add"><i class="fa-solid fa-plus me-2"></i> Add Deduction</button>
        </div>

        <div class="card">
            <div class="card-header"><h4><i class="fa-regular fa-list me-2"></i> All Deductions</h4></div>
            <div class="card-body">
                <div class="deduction-card">
                    <div class="row align-items-center">
                        <div class="col-md-3"><strong>John Doe</strong><br><small class="text-muted">Engineering</small></div>
                        <div class="col-md-3">Loan Repayment<br><small class="text-muted">July 2026</small></div>
                        <div class="col-md-2 text-danger fw-bold">$500</div>
                        <div class="col-md-2"><span class="badge bg-danger">Active</span></div>
                        <div class="col-md-2 text-end"><a href="#" class="btn btn-sm btn-info"><i class="fa-regular fa-eye"></i></a></div>
                    </div>
                </div>
                <div class="deduction-card">
                    <div class="row align-items-center">
                        <div class="col-md-3"><strong>Jane Smith</strong><br><small class="text-muted">Marketing</small></div>
                        <div class="col-md-3">Salary Advance<br><small class="text-muted">June 2026</small></div>
                        <div class="col-md-2 text-danger fw-bold">$300</div>
                        <div class="col-md-2"><span class="badge bg-warning">Partial</span></div>
                        <div class="col-md-2 text-end"><a href="#" class="btn btn-sm btn-info"><i class="fa-regular fa-eye"></i></a></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
