<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueThink AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/chatgpt.css}">
</head>
<body>
<!-- Sidebar -->
<div class="sidebar">
    <div class="logo"> BlueThink AI  </div>
    <div class="new-chat">
        <button> <i class="fa fa-plus"></i>
            New Chat
        </button>
    </div>
    <div class="menu">
        <a href="#"><i class="fa fa-message"></i> HR Assistant</a>
        <a href="#"><i class="fa fa-user"></i> Employees</a>
        <a href="#"><i class="fa fa-calendar"></i> Attendance</a>
        <a href="#"><i class="fa fa-money-bill"></i> Payroll</a>
        <a href="#"><i class="fa fa-briefcase"></i> Projects</a>
        <a href="#"><i class="fa fa-chart-line"></i> Reports</a>
    </div>
    <div class="bottom">
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-light w-100">
            <i class="fa fa-arrow-left"></i>
            Dashboard
        </a>
    </div>
</div>
<!-- Main -->
<div class="main">
    <div class="header">
        <h4>BlueThink AI Assistant</h4>
        🤖
    </div>
    <div class="chat-footer">
        <div class="prompt-box">
            <input id="question" type="text" placeholder="Message BlueThink AI...">
            <button class="send" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
</body>
</html>
