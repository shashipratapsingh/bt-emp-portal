<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlueThink AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/admin/chatgpt.css}">

</head>

<body>

<!-- ========================= -->
<!-- Sidebar -->
<!-- ========================= -->

<div class="sidebar">

    <div class="logo">
        BlueThink AI
    </div>

    <div class="new-chat">

        <button onclick="newChat()">

            <i class="fa fa-plus"></i>

            New Chat

        </button>

    </div>

    <div class="menu">

        <a href="#">
            <i class="fa fa-message"></i>
            HR Assistant
        </a>

        <a href="#">
            <i class="fa fa-user"></i>
            Employees
        </a>

        <a href="#">
            <i class="fa fa-calendar"></i>
            Attendance
        </a>

        <a href="#">
            <i class="fa fa-money-bill"></i>
            Payroll
        </a>

        <a href="#">
            <i class="fa fa-briefcase"></i>
            Projects
        </a>

        <a href="#">
            <i class="fa fa-chart-line"></i>
            Reports
        </a>
    </div>
    <div class="bottom">
        <a th:href="@{/admin/dashboard}"
           class="btn btn-outline-light w-100">
            <i class="fa fa-arrow-left"></i>
            Dashboard
        </a>
    </div>
</div>
<!-- ========================= -->
<!-- Main -->
<!-- ========================= -->
<div class="main">
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <h3>BlueThink AI Assistant</h3>
        </div>
        <div class="header-icon">
            <i class="fa-solid fa-robot"></i>
        </div>
    </div>
    <!-- Chat -->
    <div id="chatBody" class="chat-body">
        <div class="welcome-box">
            <p class="text-light">
                Ask anything related to Employees,
                Attendance,
                Payroll,
                Projects,
                Leave,
                Reports
                and HR.
            </p>
        </div>
    </div>
    <!-- Footer -->
    <div class="chat-footer">
        <div class="prompt-box">
            <input id="question"  type="text" placeholder="Message BlueThink AI..." autocomplete="off"
                    onkeydown="handleKey(event)" >
            <button class="send" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
    <script>
        let sessionId = Date.now().toString();

        function newChat() {
            sessionId = Date.now().toString();
            chatBody.innerHTML = "";
        }

        const API_URL = "http://localhost:9090/api/chat";

        const chatBody = document.getElementById("chatBody");
        const inputBox = document.getElementById("question");

        async function sendMessage() {

            const text = inputBox.value.trim();

            if (text === "") return;

            // User Message
            chatBody.innerHTML += `
        <div class="message user">
            <div class="bubble">${text}</div>
        </div>
    `;

            inputBox.value = "";
            chatBody.scrollTop = chatBody.scrollHeight;

            try {

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        prompt: text
                    })
                });

                const data = await response.json();

                // AI Message
                chatBody.innerHTML += `
            <div class="message ai">
                <div class="bubble">${data.answer}</div>
            </div>
        `;

                chatBody.scrollTop = chatBody.scrollHeight;

            } catch (e) {

                chatBody.innerHTML += `
            <div class="message ai">
                <div class="bubble" style="color:red">
                    Server Error
                </div>
            </div>
        `;

                console.log(e);
            }
        }

        function handleKey(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>

</html>
