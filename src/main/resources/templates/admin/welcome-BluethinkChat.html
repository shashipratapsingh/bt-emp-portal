<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BlueThink AI Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          th:href="@{/css/admin/chatgpt.css}">

</head>

<body>

<!-- ========================= -->
<!-- Sidebar -->
<!-- ========================= -->

<div class="sidebar">

    <div class="logo">
        BlueThink AI
    </div>

    <div class="new-chat">

        <button onclick="newChat()">

            <i class="fa fa-plus"></i>

            New Chat

        </button>

    </div>

    <div class="menu">

        <a href="#">
            <i class="fa fa-message"></i>
            HR Assistant
        </a>

        <a href="#">
            <i class="fa fa-user"></i>
            Employees
        </a>

        <a href="#">
            <i class="fa fa-calendar"></i>
            Attendance
        </a>

        <a href="#">
            <i class="fa fa-money-bill"></i>
            Payroll
        </a>

        <a href="#">
            <i class="fa fa-briefcase"></i>
            Projects
        </a>

        <a href="#">
            <i class="fa fa-chart-line"></i>
            Reports
        </a>
    </div>
    <div class="bottom">
        <a th:href="@{/admin/dashboard}"
           class="btn btn-outline-light w-100">
            <i class="fa fa-arrow-left"></i>
            Dashboard
        </a>
    </div>
</div>
<!-- ========================= -->
<!-- Main -->
<!-- ========================= -->
<div class="main">
    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <h3>BlueThink AI Assistant</h3>
        </div>
        <div class="header-icon">
            <i class="fa-solid fa-robot"></i>
        </div>
    </div>
    <!-- Chat -->
    <div id="chatBody" class="chat-body">
        <div class="welcome-box">
            <p class="text-light">
                Ask anything related to Employees,
                Attendance,
                Payroll,
                Projects,
                Leave,
                Reports
                and HR.
            </p>
        </div>
    </div>
    <!-- Footer -->
    <div class="chat-footer">
        <div class="prompt-box">
            <input id="question"  type="text" placeholder="Message BlueThink AI..." autocomplete="off"
                    onkeydown="handleKey(event)" >
            <button class="send" onclick="sendMessage()">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
<script>

    let sessionId = Date.now().toString();

    const API_URL = "http://localhost:9090/api/chat";

    const chatBody = document.getElementById("chatBody");
    const inputBox = document.getElementById("question");


    // =========================================================
    // NEW CHAT
    // =========================================================

    function newChat() {

        sessionId = Date.now().toString();

        chatBody.innerHTML = "";

        inputBox.focus();
    }


    // =========================================================
    // SEND MESSAGE
    // =========================================================

    async function sendMessage() {

        const text = inputBox.value.trim();

        if (text === "") {
            return;
        }


        // -----------------------------------------------------
        // USER MESSAGE
        // -----------------------------------------------------

        const userMessage = document.createElement("div");

        userMessage.className = "message user";

        const userBubble = document.createElement("div");

        userBubble.className = "bubble";

        // textContent prevents HTML injection
        userBubble.textContent = text;

        userMessage.appendChild(userBubble);

        chatBody.appendChild(userMessage);


        // Clear input
        inputBox.value = "";


        // Scroll down
        chatBody.scrollTop =
            chatBody.scrollHeight;


        // -----------------------------------------------------
        // AI TYPING MESSAGE
        // -----------------------------------------------------

        const aiMessage = document.createElement("div");

        aiMessage.className = "message ai";

        const aiBubble = document.createElement("div");

        aiBubble.className = "bubble";

        aiBubble.textContent = "Thinking...";

        aiMessage.appendChild(aiBubble);

        chatBody.appendChild(aiMessage);


        chatBody.scrollTop =
            chatBody.scrollHeight;


        try {

            // -------------------------------------------------
            // API CALL
            // -------------------------------------------------

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    sessionId: sessionId,

                    prompt: text

                })

            });


            // -------------------------------------------------
            // CHECK HTTP STATUS
            // -------------------------------------------------

            if (!response.ok) {

                throw new Error(
                    "HTTP Error: " + response.status
                );
            }


            // -------------------------------------------------
            // READ JSON
            // -------------------------------------------------

            const data = await response.json();


            console.log(
                ">>> API RESPONSE:",
                data
            );


            // -------------------------------------------------
            // GET ANSWER
            // -------------------------------------------------

            let answer = data.answer;


            if (!answer) {

                aiBubble.textContent =
                    "No response received from server.";

                return;
            }


            // -------------------------------------------------
            // FORMAT AI RESPONSE
            // -------------------------------------------------

            answer = formatAIResponse(answer);


            // -------------------------------------------------
            // DISPLAY AI RESPONSE
            // -------------------------------------------------

            aiBubble.innerHTML = answer;


            chatBody.scrollTop =
                chatBody.scrollHeight;


        } catch (error) {

            console.error(
                ">>> CHAT API ERROR:",
                error
            );


            aiBubble.innerHTML = `
                <span style="color:red;">
                    Server Error
                </span>
            `;

        }

    }


    // =========================================================
    // FORMAT AI RESPONSE
    // =========================================================

    function formatAIResponse(answer) {

        // ---------------------------------------------
        // Escape HTML first
        // ---------------------------------------------

        answer = escapeHtml(answer);


        // ---------------------------------------------
        // Convert **text** to bold
        //
        // Example:
        // **Independence Day**
        //
        // becomes:
        // <strong>Independence Day</strong>
        // ---------------------------------------------

        answer = answer.replace(
            /\*\*(.*?)\*\*/g,
            "<strong>$1</strong>"
        );


        // ---------------------------------------------
        // Convert newline to <br>
        //
        // \n -> <br>
        // ---------------------------------------------

        answer = answer.replace(
            /\r\n/g,
            "\n"
        );
        answer = answer.replace(
            /\n/g,
            "<br>"
        );
        return answer;
    }
    // =========================================================
    // ESCAPE HTML
    // =========================================================

    function escapeHtml(value) {
        const div =document.createElement("div");
        div.textContent = value;
        return div.innerHTML;
    }
    // =========================================================
    // ENTER KEY
    // =========================================================
    function handleKey(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    }

</script>
</body>

</html>
