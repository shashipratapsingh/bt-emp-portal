<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Salary Structure</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ===== Reset & base ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            height: 100%;
            width: 100%;
            overflow-x: hidden;
        }
        body { display: flex; flex-direction: row; }

        /* ===== Main content ===== */
        .main-content {
            flex: 1;
            padding: 0 2rem 1.5rem 2rem;
            background: #f4f7fc;
            min-height: 100vh;
            margin-left: 280px;
            width: calc(100% - 280px);
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 768px) {
            .main-content { margin-left: 0; width: 100%; padding: 0 1rem 1rem 1rem; }
        }

        /* ===== Navbar inside main content (top) ===== */
        .navbar-wrapper {
            margin: 0 -2rem 1.5rem -2rem;  /* full width inside main content */
            flex-shrink: 0;
        }
        @media (max-width: 768px) {
            .navbar-wrapper { margin: 0 -1rem 1rem -1rem; }
        }

        /* ===== Page header ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .page-header h4 {
            font-weight: 600;
            color: #1a2639;
            margin: 0;
            font-size: 1.5rem;
        }
        .page-header h4 i { color: #2a6df4; margin-right: 0.5rem; }
        .page-header .breadcrumb {
            background: transparent;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
        }
        .page-header .breadcrumb-item + .breadcrumb-item::before { content: "›"; }
        .page-header .breadcrumb-item a {
            color: #6b7a8f;
            text-decoration: none;
        }
        .page-header .breadcrumb-item.active { color: #1a2639; }

        /* ===== Card ===== */
        .card-custom {
            background: #fff;
            border-radius: 12px;
            border: 1px solid #e9edf4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 1.5rem;
            flex: 1;
        }
        .card-custom .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a2639;
            margin-bottom: 1rem;
        }

        /* ===== Form elements ===== */
        .form-label {
            font-weight: 600;
            color: #1a2639;
            font-size: 0.9rem;
        }
        .required { color: #d94a4a; }
        .form-control, .form-select {
            border: 1px solid #e9edf4;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #2a6df4;
            box-shadow: 0 0 0 3px rgba(42, 109, 244, 0.1);
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #1a2639;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e9edf4;
        }
        .section-title i { color: #2a6df4; margin-right: 0.5rem; }

        /* ===== Employee info box ===== */
        .employee-info {
            background: #f8fafc;
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e9edf4;
        }
        .employee-info p {
            margin: 0;
            font-size: 0.95rem;
            color: #1a2639;
        }
        .employee-info strong { color: #4a5a72; font-weight: 600; }

        /* ===== Buttons ===== */
        .btn {
            font-weight: 500;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #2a6df4;
            border: none;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1a5cdb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(42, 109, 244, 0.3);
        }
        .btn-secondary {
            background: #e9edf4;
            border: none;
            color: #4a5a72;
        }
        .btn-secondary:hover {
            background: #d5dbe6;
            color: #1a2639;
        }

        /* ===== Alerts ===== */
        .alert { border-radius: 10px; border: none; font-size: 0.9rem; }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: flex-start; }
            .employee-info .row > div { margin-bottom: 0.5rem; }
        }
    </style>
</head>
<body>

<!-- Include Sidebar (fixed left) -->
<div th:replace="~{fragments/sidebar-admin :: sidebar-component}"></div>

<!-- ===== MAIN CONTENT ===== -->
<div class="main-content">

    <!-- ===== NAVBAR AT TOP ===== -->
    <div class="navbar-wrapper">
        <div th:replace="~{fragments/navbar :: navbar}"></div>
    </div>

    <!-- ===== PAGE HEADER ===== -->
    <div class="page-header">
        <div>
            <h4><i class="fa-solid fa-plus-circle"></i> <span th:text="${pageTitle}">Add Salary Structure</span></h4>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/admin/dashboard">Dashboard</a></li>
                    <li class="breadcrumb-item"><a href="/admin/salary-structure/list">Salary Structures</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Add</li>
                </ol>
            </nav>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="today-badge" style="background: rgba(42,109,244,0.1); color: #2a6df4; padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem;">
                <i class="fa-regular fa-calendar"></i> <span th:text="${#temporals.format(#temporals.createNow(), 'dd MMM yyyy')}">20 Jul 2026</span>
            </span>
            <a href="/auth/logout" class="logout-btn" style="color: #6b7a8f; text-decoration: none; padding: 0.4rem 1rem; border-radius: 8px; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px;">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </a>
        </div>
    </div>

    <!-- Error Alert -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fa-regular fa-circle-xmark me-2"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- ===== MAIN CARD ===== -->
    <div class="card-custom">
        <div class="card-title">
            <i class="fa-regular fa-pen-to-square me-2" style="color: #2a6df4;"></i> Create Salary Structure
        </div>

        <!-- Employee Info (with safe null handling) -->
        <div class="employee-info">
            <div class="row">
                <div class="col-md-6">
                    <p><strong><i class="fa-regular fa-user me-2"></i>Employee:</strong>
                        <span th:text="${employee != null ? employee.fullName : 'N/A'}">N/A</span>
                    </p>
                </div>
                <div class="col-md-6">
                    <p><strong><i class="fa-regular fa-building me-2"></i>Department:</strong>
                        <span th:text="${employee != null and employee.department != null ? employee.department.departmentName : 'N/A'}">N/A</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- Form -->
        <form th:action="@{/admin/salary-structure/save}" th:object="${salaryStructureDTO}" method="post">
            <input type="hidden" th:field="*{employeeId}" />

            <!-- Earnings -->
            <div class="section-title"><i class="fa-solid fa-circle-dollar"></i> Earnings</div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Basic Salary <span class="required">*</span></label>
                    <input type="number" step="0.01" class="form-control" th:field="*{basicSalary}" required />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">HRA</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{hra}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Conveyance</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{conveyance}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Medical Allowance</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{medicalAllowance}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Special Allowance</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{specialAllowance}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Other Allowance</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{otherAllowance}" />
                </div>
            </div>

            <!-- Deductions -->
            <div class="section-title mt-4"><i class="fa-solid fa-circle-minus"></i> Deductions</div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">PF</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{pf}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">ESI</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{esi}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Professional Tax</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{professionalTax}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">TDS</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{tds}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Loan Deduction</label>
                    <input type="number" step="0.01" class="form-control" th:field="*{loanDeduction}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Effective From</label>
                    <input type="date" class="form-control" th:field="*{effectiveFrom}" />
                </div>
            </div>

            <!-- Buttons -->
            <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
                <a th:href="@{/admin/salary-structure/list}" class="btn btn-secondary">
                    <i class="fa-regular fa-xmark me-1"></i> Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-regular fa-floppy-disk me-1"></i> Save Structure
                </button>
            </div>
        </form>
    </div>

    <!-- Footer -->
    <div class="mt-4 text-muted" style="font-size:0.75rem; border-top:1px solid #e9edf4; padding-top:1rem;">
        <span>HRMS v2.0</span>
        <span class="ms-3">Add Salary Structure</span>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
