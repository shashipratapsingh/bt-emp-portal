<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Employee Timesheet Management</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet"
          th:href="@{/css/admin/timesheet-management/all-timesheet.css}">

</head>

<body>

<!-- Sidebar -->
<div th:replace="~{fragments/sidebar-admin :: sidebar-component}"></div>

<div class="main-content">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div>

            <h2>Employee Timesheet Management</h2>

            <div class="breadcrumb">
                Dashboard
                <span>›</span>
                Timesheet Management
            </div>

        </div>

        <button class="btn btn-primary">
            <i class="fa-solid fa-download me-2"></i>
            Export
        </button>

    </div>

    <!-- ================= CARD ================= -->

    <div class="card shadow-sm border-0">

        <div class="card-body">

            <div class="card-title-area">

                <h5>
                    <i class="fa-solid fa-users text-primary"></i>
                    Employee List
                </h5>

            </div>

            <!-- ================= SEARCH ================= -->

            <div class="filter-section">

                <input type="text"
                       class="form-control"
                       placeholder="Search Employee Name / ID">

                <button class="btn btn-primary">
                    <i class="fa-solid fa-search"></i>
                </button>

            </div>

            <!-- ================= TABLE ================= -->

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                    <tr>

                        <th>#</th>
                        <th>Employee ID</th>
                        <th>Employee Name</th>
                        <th class="text-center">Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="employee, stat : ${employees}">

                        <td th:text="${stat.count}"></td>

                        <td>

                            <span class="badge bg-info"
                                  th:text="${employee.employeeId}">
                            </span>

                        </td>

                        <td th:text="${employee.employeeName}"></td>

                        <td class="text-center">

                            <a th:href="@{/admin/timesheets/view/{employeeId}(employeeId=${employee.employeeId})}"
                               class="btn btn-sm btn-primary">

                                <i class="fa-solid fa-eye"></i>
                                View

                            </a>

                        </td>

                    </tr>

                    <!-- No Employee -->

                    <tr th:if="${#lists.isEmpty(employees)}">

                        <td colspan="4"
                            class="text-center text-muted py-5">

                            <i class="fa-solid fa-folder-open fa-2x mb-3"></i>

                            <br>

                            No Employees Found

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>

</html>
