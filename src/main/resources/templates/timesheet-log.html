<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Daily Timesheet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Summernote CSS -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/timesheet-log.css}">
</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar-component}"></aside>

    <!-- MAIN INTERFACE WRAPPER -->
    <div class="main-content">

        <!-- CONTENT BODY -->
        <main class="content-body">
            <div class="container-fluid" style="max-width: 1200px; padding: 0;">

                <!-- HEADER SECTION -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fs-4 m-0 fw-bold tracking-tight text-slate-900">
                        <i class="fa-solid fa-clock me-2 opacity-75" style="color: var(--profile-primary);"></i>Daily Timesheet Log
                    </h2>
                    <a th:href="@{/employee/dashboard}" class="btn btn-custom-dashboard rounded-pill px-4 fw-medium">
                        <i class="fa-solid fa-house me-2"></i> Back to Dashboard
                    </a>
                </div>

                <!-- Success Message -->
                <div th:if="${param.success}"
                     id="successAlert"
                     class="alert alert-success alert-dismissible fade show">

                    <i class="fa-solid fa-circle-check me-2"></i>
                    <strong>Success!</strong>
                    Timesheet Submitted Successfully.

                </div>

                <!-- SUBMIT LOG CARD -->
                <div class="section-card">
                    <h4 class="section-title">
                        <i class="fa-solid fa-pen-to-square me-2"></i>
                        Submit New Entry
                    </h4>

                    <form th:action="@{/employee/timesheet/submit}"
                          th:object="${timesheet}"
                          method="post">

                        <div class="row g-3">

                            <!-- Date -->
                            <div class="col-md-3">

                                <label class="form-label">
                                    Date
                                </label>

                                <input type="date"
                                       class="form-control"
                                       th:field="*{date}"
                                       required>

                            </div>

                            <!-- Hours -->
                            <div class="col-md-3">

                                <label class="form-label">
                                    Hours Worked
                                </label>

                                <input type="number"
                                       class="form-control"
                                       th:field="*{hoursWorked}"
                                       min="0"
                                       max="24"
                                       step="0.5"
                                       required>

                            </div>

                            <!-- Project -->
                            <div class="col-md-3">

                                <label class="form-label">
                                    Assigned Project
                                </label>

                                <select name="project.id"
                                        class="form-select"
                                        required>

                                    <option value="">
                                        -- Select Project --
                                    </option>

                                    <option th:each="project:${projects}"
                                            th:value="${project.id}"
                                            th:text="${project.projectName}">
                                    </option>

                                </select>

                            </div>

                            <!-- Submit Button -->
                            <div class="col-md-3 d-flex align-items-end">

                                <button type="submit"
                                        class="btn btn-submit-profile w-100">

                                    <i class="fa-solid fa-paper-plane me-2"></i>
                                    Submit Log

                                </button>

                            </div>

                            <!-- Task Description -->
                            <div class="col-12">

                                <label for="taskDescription" class="form-label">
                                    Task Description
                                </label>

                                <textarea id="taskDescription"
                                          class="form-control"
                                          rows="8"
                                          th:field="*{taskDescription}"
                                          placeholder="Describe your work..."
                                          required>
    </textarea>

                            </div>
                        </div>

                    </form>

                </div>

                <!-- History Card -->
                <div class="section-card">

                    <h4 class="section-title">

                        <i class="fa-solid fa-history me-2"></i>
                        Your Log History

                    </h4>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle">

                            <thead>

                            <tr>

                                <th>DATE</th>
                                <th>PROJECT NAME</th>
                                <th>HOURS</th>
                                <th>TASK</th>
                                <th>STATUS</th>
                                <th class="text-center">ACTIONS</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="log:${myLogs}">

                                <td th:text="${log.date}"></td>
                                <td th:text="${log.project.projectName}"></td>

                                <td th:text="${log.hoursWorked + ' hrs'}"></td>

                                <td>
                                    <div class="task-preview"
                                         th:text="${log.taskDescription}">
                                    </div>
                                </td>

                                <td>

                                    <span class="badge bg-warning text-dark"
                                          th:if="${log.status == 'PENDING'}">
                                        PENDING
                                    </span>

                                    <span class="badge bg-success"
                                          th:if="${log.status == 'APPROVED'}">
                                        APPROVED
                                    </span>

                                    <span class="badge bg-danger"
                                          th:if="${log.status == 'REJECTED'}">
                                        REJECTED
                                    </span>

                                </td>
                                <td class="text-center">

                                    <!-- View -->
                                    <a th:href="@{/employee/timesheet/view/{id}(id=${log.id})}"
                                       class="btn btn-sm btn-outline-info me-2"
                                       title="View Timesheet">

                                        <i class="fa-solid fa-eye"></i>

                                    </a>


                                    <!-- Edit -->
                                    <a th:href="@{/employee/timesheet/edit/{id}(id=${log.id})}"
                                       class="btn btn-sm btn-outline-primary"
                                       title="Edit Timesheet">

                                        <i class="fa-solid fa-pen-to-square"></i>

                                    </a>

                                </td>

                            </tr>

                            <!-- Empty Data -->
                            <tr th:if="${#lists.isEmpty(myLogs)}">

                                <td colspan="6"
                                    class="text-center text-muted">

                                    No Timesheet Found

                                </td>

                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>

            <!-- FOOTER COPYRIGHT SECTION -->
            <footer class="mt-5 pt-4 text-center text-muted border-top" style="font-size: 12px;">
                <p class="mb-0">Copyright &copy; 2026 Bluethink IT Consulting Pvt. Ltd. All rights reserved.</p>
            </footer>
        </main>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Summernote -->
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        const alert = document.getElementById("successAlert");

        if (alert) {
            setTimeout(() => {
                alert.style.transition = "opacity .5s";
                alert.style.opacity = "0";

                setTimeout(() => {
                    alert.remove();
                }, 500);

            }, 3000);
        }

        $('#taskDescription').summernote({
            height: 220,
            placeholder: 'Describe your work...',
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'italic', 'underline', 'clear']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link']],
                ['view', ['codeview']]
            ]
        });

    });
</script>


</body>
</html>
