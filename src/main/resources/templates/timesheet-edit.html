<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Timesheet</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/timesheet-edit.css}">

    <!-- Summernote CSS -->
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.css" rel="stylesheet">

</head>

<body>

<div class="dashboard-container">

    <!-- Sidebar -->
    <aside th:replace="~{fragments/sidebar :: sidebar-component}"></aside>

    <!-- Main Content -->
    <div class="main-content">

        <div class="card shadow edit-card">

            <div class="card-header-custom">
                <h4 class="mb-0">
                    <i class="fa-solid fa-pen-to-square me-2"></i>
                    Edit Timesheet
                </h4>
            </div>

            <div class="card-body">

                <form th:action="@{/employee/timesheet/update}"
                      th:object="${timesheet}"
                      method="post">

                    <!-- Hidden ID -->
                    <input type="hidden" th:field="*{id}">

                    <!-- Date & Hours -->
                    <div class="row">

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="fa-solid fa-calendar-days me-2"></i>
                                Date
                            </label>

                            <!-- Display only -->
                            <input type="date"
                                   class="form-control"
                                   th:value="${#temporals.format(timesheet.date, 'yyyy-MM-dd')}"
                                   readonly>

                            <!-- Actual value submitted -->
                            <input type="hidden" th:field="*{date}">
                        </div>

                        <div class="col-md-6 mb-4">
                            <label class="form-label">
                                <i class="fa-solid fa-hourglass-half me-2"></i>
                                Hours Worked
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{hoursWorked}"
                                   min="0"
                                   max="24"
                                   step="0.5"
                                   required>
                        </div>

                    </div>

                    <!-- Task Description -->
                    <div class="mb-4">

                        <label class="form-label">
                            <i class="fa-solid fa-align-left me-2"></i>
                            Task Description
                        </label>

                        <textarea id="taskDescription"
                                  class="form-control"
                                  rows="6"
                                  th:field="*{taskDescription}"
                                  placeholder="Enter task description..."
                                  required></textarea>

                    </div>

                    <!-- Buttons -->
                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/employee/timesheet/log}"
                           class="btn btn-outline-secondary btn-cancel">
                            <i class="fa-solid fa-arrow-left me-2"></i>
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-update">
                            <i class="fa-solid fa-floppy-disk me-2"></i>
                            Update Timesheet
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Summernote JS -->
<script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-bs5.min.js"></script>

<script>
    $(document).ready(function () {

        $('#taskDescription').summernote({
            height: 220,
            placeholder: 'Enter task description...',
            toolbar: [
                ['style', ['style']],
                ['font', ['bold', 'italic', 'underline', 'clear']],
                ['para', ['ul', 'ol', 'paragraph']],
                ['table', ['table']],
                ['insert', ['link']],
                ['view', ['codeview']]
            ]
        });

    });
</script>

</body>
</html>
