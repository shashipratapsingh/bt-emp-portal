<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<header class="navbar bg-white shadow-sm fixed-top"
        style="left:250px;height:80px;z-index:999;">

    <div class="container-fluid">

        <div class="row w-100 align-items-center g-3">

            <!-- Left -->
            <div class="col-lg-3 col-md-12 d-flex align-items-center">
                <button class="btn d-lg-none me-3">
                    <i class="fas fa-bars"></i>
                </button>

                <div>
                    <h5 class="fw-bold mb-0">
                        Welcome back, Admin! 👋
                    </h5>
                    <small class="text-muted">
                        Here's what's happening with your company today
                    </small>
                </div>
            </div>

            <!-- Center -->
            <div class="col-lg-4 col-md-12">
                <div class="d-flex gap-2 justify-content-center flex-wrap">

                    <input type="month" class="form-control" style="max-width:150px;">

                    <input type="month" class="form-control" style="max-width:150px;">

                    <select class="form-select" style="max-width:180px;">
                        <option>All Branches</option>
                        <option>Mumbai</option>
                        <option>Delhi</option>
                        <option>Bangalore</option>
                    </select>

                </div>
            </div>

            <!-- Right -->
            <div class="col-lg-5 col-md-12">

                <div class="d-flex align-items-center justify-content-end gap-3 flex-wrap">

                    <div class="input-group" style="max-width:300px;">
                        <span class="input-group-text bg-light border-end-0">
                            <i class="fas fa-search"></i>
                        </span>
                        <input type="search"
                               class="form-control border-start-0"
                               placeholder="Search employees...">
                    </div>

                    <button class="btn position-relative">
                        <i class="far fa-bell fs-5"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                            5
                        </span>
                    </button>

                    <div class="d-flex align-items-center">
                        <img src="https://ui-avatars.com/api/?name=Admin&background=695CFE&color=fff"
                             class="rounded-circle"
                             width="42"
                             height="42">

                        <div class="ms-2">
                            <div class="fw-semibold">Administrator</div>
                            <small class="text-muted">Admin</small>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

</header>
