<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notifications</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/notification.css}">
</head>

<body>

<div class="container mt-4">

    <div class="header-card">
        <h2>
            <i class="fas fa-bell"></i>
            Notifications
        </h2>
        <p class="mb-0">
            View all system notifications and announcements.
        </p>
    </div>

    <div th:if="${#lists.isEmpty(notifications)}">
        <div class="alert alert-warning">
            No notifications available.
        </div>
    </div>

    <div th:each="notification : ${notifications}">

        <div class="card notification-card"
             th:classappend="${notification.readStatus} ? 'read' : 'unread'">

            <div class="card-body">

                <div class="d-flex justify-content-between">

                    <h5 th:text="${notification.title}">
                        Notification Title
                    </h5>

                    <span class="badge bg-danger"
                          th:if="${!notification.readStatus}">
                        New
                    </span>

                </div>

                <p class="mt-2"
                   th:text="${notification.message}">
                    Notification Message
                </p>

                <div class="notification-time">
                    <i class="fas fa-clock"></i>
                    <span th:text="${notification.createdAt}">
                        Date Time
                    </span>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
